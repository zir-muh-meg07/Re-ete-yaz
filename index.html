<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Tarımsal Reçete</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#111;--muted:#6e6e73;--line:#d1d1d6;
  --accent:#2e7d32;--danger:#c62828;--soft:#eef6ee;--radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{min-height:100vh}
.app{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(104px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:29px;line-height:1.02;letter-spacing:-.7px}
.date{font-size:13px;color:var(--muted);margin-top:5px}
.header-actions{display:flex;gap:7px}
.topbtn{border:0;background:#fff;border-radius:14px;padding:11px 12px;font-weight:800;font-size:14px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:11px 0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.section-title{font-size:18px;font-weight:850;margin:0 0 4px}
.section-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
label{display:block;font-size:13px;font-weight:750;color:var(--muted);margin-bottom:7px}
input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);
  font:inherit;font-size:17px;padding:14px 13px;outline:none;
}
select{min-height:52px}
textarea{min-height:95px;resize:vertical;line-height:1.35}
input:focus,textarea:focus,select:focus{border-color:#84b686;box-shadow:0 0 0 3px rgba(46,125,50,.10)}
.customer input{font-size:18px;font-weight:700}
.item-row{
  display:grid;grid-template-columns:34px minmax(0,1.55fr) minmax(105px,.85fr);
  gap:8px;align-items:center;margin-bottom:9px
}
.num{height:34px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:850;color:var(--accent)}
.item-row input{min-height:52px}
.manual{border-top:1px solid #ececf0;margin-top:12px;padding-top:12px}
.wait{display:grid;grid-template-columns:1fr 76px;gap:10px;align-items:end;margin-top:12px}
.wait .unit{padding-bottom:15px;color:var(--muted);font-weight:800}
.small-actions{display:flex;gap:8px;margin-top:12px}
.smallbtn{border:0;border-radius:12px;padding:11px 12px;font-weight:800;background:#f1f1f5}
.smallbtn.danger{color:var(--danger);background:#fff0f0}
.panel{display:none}.panel.show{display:block}
.segment{display:grid;grid-template-columns:1fr 1fr;background:#e9e9ee;border-radius:13px;padding:3px;margin:10px 0 12px}
.segment button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:800}
.segment .active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.addbtn{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:0 16px;font-weight:850}
.product-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid #efeff4}
.del{border:0;border-radius:10px;background:#fff0f0;color:var(--danger);padding:8px 10px;font-weight:800}
.history-item{border:1px solid #e5e5ea;border-radius:14px;padding:12px;margin:9px 0}
.history-head{display:flex;justify-content:space-between;gap:10px}
.history-name{font-weight:850}.history-date{font-size:12px;color:var(--muted)}
.history-actions{display:flex;gap:8px;margin-top:9px}
.mini{border:0;border-radius:10px;padding:9px 11px;font-weight:800;background:var(--soft);color:var(--accent)}
.mini.delete{background:#fff0f0;color:var(--danger)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(242,242,247,.94);backdrop-filter:blur(18px);
  border-top:1px solid rgba(0,0,0,.08);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))
}
.bottom-inner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr;gap:10px}
.save,.print{border:0;border-radius:15px;padding:16px 12px;font-size:17px;font-weight:900}
.save{background:#fff;color:var(--accent);border:1px solid #cfd8cf}.print{background:var(--accent);color:#fff}
.print-only{display:none}
@media (max-width:430px){
  .item-row{grid-template-columns:32px minmax(0,1fr)}
  .item-row input{grid-column:2}
}
@media print{
  @page{size:80mm auto;margin:5mm}
  body{background:#fff}.app,.bottom{display:none!important}
  .print-only{display:block!important;width:70mm;margin:0 auto;font-family:Arial,sans-serif;color:#000}
  .print-only h2{text-align:center;margin:0 0 7px;font-size:18px}
  .print-only .pdate{text-align:center;font-size:11px;margin-bottom:9px}
  .print-only .block{margin:9px 0}
  .print-only .label{font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
  .print-only .value{font-size:12.5px;white-space:pre-wrap;line-height:1.35}
  .print-only hr{border:0;border-top:1px dashed #000;margin:9px 0}
}
</style>
</head>
<body>
<main class="app">
  <div class="header">
    <div>
      <h1>Tarımsal Reçete</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="header-actions">
      <button class="topbtn" id="productsBtn">Ürünler</button>
      <button class="topbtn" id="historyBtn">Geçmiş</button>
    </div>
  </div>

  <section class="card customer">
    <label>Müşteri adı</label>
    <input id="customer" type="text" placeholder="Müşteri adını yaz">
  </section>

  <section class="card">
    <div class="section-title">Gübreleme Reçetesi</div>
    <div class="section-sub">Ürünü seç, dozu kendin yaz.</div>
    <div id="fertRows"></div>
    <div class="manual">
      <label>Manuel yaz</label>
      <textarea id="fertManual" placeholder="Listede olmayan ürün veya ek bilgi..."></textarea>
    </div>
  </section>

  <section class="card">
    <div class="section-title">İlaçlama Reçetesi</div>
    <div class="section-sub">Ürünü seç, dozu kendin yaz.</div>
    <div id="sprayRows"></div>
    <div class="manual">
      <label>Manuel yaz</label>
      <textarea id="sprayManual" placeholder="Listede olmayan ürün veya ek bilgi..."></textarea>
    </div>
    <div class="wait">
      <div>
        <label>Bekleme süresi</label>
        <input id="wait" type="number" min="0" inputmode="numeric" placeholder="7">
      </div>
      <div class="unit">gün</div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">Genel Notlar</div>
    <textarea id="notes" placeholder="Genel notları yaz..."></textarea>
    <div class="small-actions">
      <button class="smallbtn danger" id="clearBtn">Formu Temizle</button>
    </div>
  </section>

  <section class="card panel" id="productsPanel">
    <div class="section-title">Ürünleri Yönet</div>
    <div class="section-sub">Eklediğin ürünler seçim listelerinde görünür.</div>
    <div class="segment">
      <button id="tabFert" class="active">Gübreler</button>
      <button id="tabSpray">İlaçlar</button>
    </div>
    <div class="addrow">
      <input id="newProduct" type="text" placeholder="Yeni ürün adı">
      <button class="addbtn" id="addProduct">Ekle</button>
    </div>
    <div id="productList" style="margin-top:10px"></div>
  </section>

  <section class="card panel" id="historyPanel">
    <div class="section-title">Kayıtlı Reçeteler</div>
    <div id="historyList"></div>
  </section>
</main>

<div class="bottom">
  <div class="bottom-inner">
    <button class="save" id="saveBtn">Kaydet</button>
    <button class="print" id="printBtn">Yazdır</button>
  </div>
</div>

<div class="print-only">
  <h2>TARIMSAL REÇETE</h2>
  <div class="pdate" id="pDate"></div>
  <hr>
  <div class="block"><div class="label">Müşteri</div><div class="value" id="pCustomer"></div></div>
  <div class="block"><div class="label">Gübreleme Reçetesi</div><div class="value" id="pFert"></div></div>
  <div class="block"><div class="label">İlaçlama Reçetesi</div><div class="value" id="pSpray"></div></div>
  <div class="block"><div class="label">Bekleme Süresi</div><div class="value" id="pWait"></div></div>
  <div class="block"><div class="label">Genel Notlar</div><div class="value" id="pNotes"></div></div>
  <hr>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const REC_KEY="tarimsal_receteler_v3", PROD_KEY="tarimsal_urunler_v3";
  const defaults={fertilizer:[],spray:[]};

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
  function readProducts(){
    try{
      const x=JSON.parse(localStorage.getItem(PROD_KEY));
      return x&&Array.isArray(x.fertilizer)&&Array.isArray(x.spray)?x:JSON.parse(JSON.stringify(defaults));
    }catch(e){return JSON.parse(JSON.stringify(defaults));}
  }
  function saveProducts(){localStorage.setItem(PROD_KEY,JSON.stringify(products))}
  let products=readProducts();
  $("today").textContent=new Date().toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});

  function makeRows(container,prefix){
    container.innerHTML=Array.from({length:10},(_,i)=>`
      <div class="item-row">
        <div class="num">${i+1}</div>
        <select id="${prefix}Product${i}"><option value="">Ürün seç</option></select>
        <input id="${prefix}Dose${i}" type="text" placeholder="Doz / miktar">
      </div>`).join("");
  }
  makeRows($("fertRows"),"fert"); makeRows($("sprayRows"),"spray");

  function fillOne(sel,items){
    const current=sel.value;
    sel.innerHTML='<option value="">Ürün seç</option>'+items.map(x=>`<option>${esc(x)}</option>`).join("");
    if(items.includes(current)) sel.value=current;
  }
  function refreshSelects(){
    for(let i=0;i<10;i++){
      fillOne($(`fertProduct${i}`),products.fertilizer);
      fillOne($(`sprayProduct${i}`),products.spray);
    }
  }
  refreshSelects();

  let category="fertilizer";
  function renderProducts(){
    const list=$("productList"),items=products[category];
    if(!items.length){list.innerHTML='<div class="empty">Henüz ürün eklenmedi.</div>';return;}
    list.innerHTML="";
    items.forEach((name,idx)=>{
      const el=document.createElement("div");el.className="product-item";
      el.innerHTML=`<div>${esc(name)}</div><button class="del">Sil</button>`;
      el.querySelector("button").onclick=()=>{
        products[category].splice(idx,1);saveProducts();renderProducts();refreshSelects();
      };
      list.appendChild(el);
    });
  }
  $("tabFert").onclick=()=>{category="fertilizer";$("tabFert").classList.add("active");$("tabSpray").classList.remove("active");renderProducts()};
  $("tabSpray").onclick=()=>{category="spray";$("tabSpray").classList.add("active");$("tabFert").classList.remove("active");renderProducts()};
  $("addProduct").onclick=()=>{
    const v=$("newProduct").value.trim(); if(!v)return;
    if(!products[category].includes(v))products[category].push(v);
    saveProducts();$("newProduct").value="";renderProducts();refreshSelects();
  };

  function togglePanel(which){
    const p=$("productsPanel"),h=$("historyPanel");
    if(which==="products"){p.classList.toggle("show");h.classList.remove("show");renderProducts();if(p.classList.contains("show"))setTimeout(()=>p.scrollIntoView({behavior:"smooth"}),50)}
    else{h.classList.toggle("show");p.classList.remove("show");renderHistory();if(h.classList.contains("show"))setTimeout(()=>h.scrollIntoView({behavior:"smooth"}),50)}
  }
  $("productsBtn").onclick=()=>togglePanel("products");
  $("historyBtn").onclick=()=>togglePanel("history");

  function collect(prefix){
    const a=[];
    for(let i=0;i<10;i++){
      const product=$(`${prefix}Product${i}`).value.trim();
      const dose=$(`${prefix}Dose${i}`).value.trim();
      if(product||dose)a.push({product,dose});
    }
    return a;
  }
  function formData(){
    return {
      id:Date.now(),createdAt:new Date().toISOString(),
      customer:$("customer").value.trim(),
      fertilizer:collect("fert"),fertManual:$("fertManual").value.trim(),
      spray:collect("spray"),sprayManual:$("sprayManual").value.trim(),
      wait:$("wait").value.trim(),notes:$("notes").value.trim()
    };
  }
  function readAll(){try{return JSON.parse(localStorage.getItem(REC_KEY)||"[]")}catch(e){return[]}}
  function writeAll(x){localStorage.setItem(REC_KEY,JSON.stringify(x));renderHistory()}
  function clearForm(confirmFirst=true){
    if(confirmFirst && !confirm("Formdaki bilgiler temizlensin mi?"))return;
    $("customer").value="";$("fertManual").value="";$("sprayManual").value="";$("wait").value="";$("notes").value="";
    for(let i=0;i<10;i++){ $(`fertProduct${i}`).value="";$(`fertDose${i}`).value="";$(`sprayProduct${i}`).value="";$(`sprayDose${i}`).value=""; }
    window.scrollTo({top:0,behavior:"smooth"});
  }
  $("clearBtn").onclick=()=>clearForm(true);

  $("saveBtn").onclick=()=>{
    const r=formData();
    if(!r.customer){alert("Müşteri adını yazın.");$("customer").focus();return;}
    const all=readAll();all.unshift(r);writeAll(all.slice(0,200));alert("Reçete kaydedildi.");
  };

  function fillForm(r){
    $("customer").value=r.customer||"";
    for(let i=0;i<10;i++){
      $(`fertProduct${i}`).value=r.fertilizer?.[i]?.product||"";
      $(`fertDose${i}`).value=r.fertilizer?.[i]?.dose||"";
      $(`sprayProduct${i}`).value=r.spray?.[i]?.product||"";
      $(`sprayDose${i}`).value=r.spray?.[i]?.dose||"";
    }
    $("fertManual").value=r.fertManual||"";$("sprayManual").value=r.sprayManual||"";
    $("wait").value=r.wait||"";$("notes").value=r.notes||"";
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderHistory(){
    const list=$("historyList"),all=readAll();
    if(!all.length){list.innerHTML='<div class="empty">Henüz kayıtlı reçete yok.</div>';return}
    list.innerHTML="";
    all.forEach(r=>{
      const d=new Date(r.createdAt),el=document.createElement("div");el.className="history-item";
      el.innerHTML=`<div class="history-head"><div class="history-name">${esc(r.customer||"İsimsiz")}</div>
      <div class="history-date">${d.toLocaleDateString("tr-TR")} ${d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</div></div>
      <div class="history-actions"><button class="mini open">Aç</button><button class="mini delete">Sil</button></div>`;
      el.querySelector(".open").onclick=()=>fillForm(r);
      el.querySelector(".delete").onclick=()=>{if(confirm("Bu kayıt silinsin mi?"))writeAll(readAll().filter(x=>x.id!==r.id))};
      list.appendChild(el);
    });
  }

  function fmt(items,manual){
    const lines=(items||[]).map((x,i)=>`${i+1}. ${x.product||"Ürün"}${x.dose?" — "+x.dose:""}`);
    if(manual)lines.push(manual);
    return lines.length?lines.join("\n"):"-";
  }
  $("printBtn").onclick=()=>{
    const r=formData();
    $("pDate").textContent=new Date().toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    $("pCustomer").textContent=r.customer||"-";
    $("pFert").textContent=fmt(r.fertilizer,r.fertManual);
    $("pSpray").textContent=fmt(r.spray,r.sprayManual);
    $("pWait").textContent=r.wait?`${r.wait} gün`:"-";
    $("pNotes").textContent=r.notes||"-";
    window.print();
  };

  renderProducts(); renderHistory();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
